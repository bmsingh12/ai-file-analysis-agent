version: "3.9"

services:
  backend:
    build: .
    container_name: ai-file-agent-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Mount your local folder to container
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload